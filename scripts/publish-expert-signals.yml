name: Publish Expert Signals

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate Expert Signals
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: |
          node scripts/tinyfish-expert-publisher.js

      - name: Commit published signals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/public-signals.json

          if git diff --cached --quiet; then
            echo "No changes to public signals."
            exit 0
          fi

          git commit -m "Publish expert signals"
          git push
