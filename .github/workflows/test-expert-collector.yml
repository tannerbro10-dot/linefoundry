name: Test Expert Collector

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Collect Expert Article
        run: |
          node scripts/expert-source-collector.js \
            "https://www.cbssports.com/betting/news/nfl-picks-today-odds-lines-bets-week-2-2026-expert-predictions-spread-parlays-prop-bets/" \
            > scripts/test-article.json

      - name: Extract Expert Props
        run: |
          node scripts/expert-prop-extractor.js \
            scripts/test-article.json
