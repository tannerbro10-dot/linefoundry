name: Test Market Collector

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Market Collector Test
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          TEST_EVENT_ID: FznP2IcFgXu9TcHvvja3
        run: |
          node scripts/market-data-collector.js

           - name: Show Market Summary
        run: |
          node <<'NODE'
          const fs = require("fs");

          const data =
            JSON.parse(
              fs.readFileSync(
                "market-data.json",
                "utf8"
              )
            );

          console.log("");
          console.log("========================================");
          console.log("MARKET COLLECTOR TEST");
          console.log("========================================");

          console.log(
            `Events: ${data.eventCount}`
          );

          console.log(
            `Markets: ${data.marketCount}`
          );

          console.log("");
          console.log("FIRST 25 MARKETS");
          console.log("----------------------------------------");

          data.markets
            .slice(0, 25)
            .forEach((market, index) => {

              const player =
                market.player?.name ||
                "Unknown Player";

              const marketName =
                market.market?.name ||
                "Unknown Market";

              const over =
                market.sides?.over;

              const under =
                market.sides?.under;

              const yes =
                market.sides?.yes;

              const no =
                market.sides?.no;

              if (yes || no) {

                console.log(
                  `${index + 1}. ${player} | ${marketName} | YES ${yes?.odds ?? "—"} | NO ${no?.odds ?? "—"}`
                );

              } else {

                console.log(
                  `${index + 1}. ${player} | ${marketName} | ${over?.line ?? "—"} | OVER ${over?.odds ?? "—"} | UNDER ${under?.odds ?? "—"}`
                );

              }

            });

          console.log("");
          console.log("========================================");
          NODE

      - name: Commit Market Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add market-data.json

          git diff --cached --quiet || git commit -m "Update market data"

          git push
