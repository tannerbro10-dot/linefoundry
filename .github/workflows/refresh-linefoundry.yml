name: Refresh LineFoundry

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Yep Search
        env:
          YEP_API_KEY: ${{ secrets.YEP_API_KEY }}
        run: |
          node scripts/yep-search.js

      - name: Collect Yep Articles
        run: |
          node scripts/yep-article-collector.js

      - name: Show Collection Summary
        run: |
          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync(
              "yep-articles.json",
              "utf8"
            )
          );

          console.log("");
          console.log("========================================");
          console.log("YEP ARTICLE COLLECTION");
          console.log("========================================");
          console.log(`Search results: ${data.resultCount}`);
          console.log(`Unique URLs: ${data.urlCount}`);
          console.log(`Successful: ${data.successfulCount}`);
          console.log(`Failed: ${data.failedCount}`);
          console.log("========================================");
          NODE

      - name: Commit Results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add yep-results.json
          git add yep-articles.json

          git diff --cached --quiet || git commit -m "Refresh Yep articles"

          git push
