name: Refresh LineFoundry

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Yep Search
        env:
          YEP_API_KEY: ${{ secrets.YEP_API_KEY }}
        run: |
          node scripts/yep-search.js

      - name: Show Yep Results
        run: |
          echo "Yep search completed."
          ls -lh yep-results.json

      - name: Commit Results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add yep-results.json

          git diff --cached --quiet || git commit -m "Refresh Yep search results"

          git push
